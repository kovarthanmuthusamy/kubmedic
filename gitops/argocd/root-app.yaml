# App-of-apps: install ArgoCD, then apply this once
# (kubectl apply -f gitops/argocd/root-app.yaml). ArgoCD then manages
# every Application in gitops/argocd/apps/, including the boutique app.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubmedic-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kovarthanmuthusamy/kubmedic.git
    targetRevision: main
    path: gitops/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
