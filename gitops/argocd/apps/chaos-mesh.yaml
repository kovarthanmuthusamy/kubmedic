# Chaos Mesh is installed for optional network/latency experiments.
# The benchmark itself does NOT depend on it: benchmark faults are
# deterministic faulty commits to gitops/app/values.yaml (see chaos/),
# which is what makes every scenario exactly reproducible.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chaos-mesh
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.chaos-mesh.org
    chart: chaos-mesh
    targetRevision: "2.*"
    helm:
      values: |
        chaosDaemon:
          runtime: docker
  destination:
    server: https://kubernetes.default.svc
    namespace: chaos-testing
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
