apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubmedic-policy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/kovarthanmuthusamy/kubmedic.git
    targetRevision: main
    path: gitops/policy
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
