# The agent as a webhook service: Alertmanager posts here, the agent
# investigates with its read-only service account and opens a PR.
# NOTE: opening PRs needs a git credential for the GitOps repo; the
# benchmark harness (evals/) runs the same code locally where the
# checkout and credential already exist. See docs/architecture.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubmedic-agent
  namespace: boutique-agent
  labels:
    app: kubmedic-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubmedic-agent
  template:
    metadata:
      labels:
        app: kubmedic-agent
    spec:
      serviceAccountName: kubmedic-agent
      containers:
        - name: agent
          image: ghcr.io/kovarthanmuthusamy/kubmedic-agent:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: KUBMEDIC_MODEL
              value: ollama/qwen2.5:7b-instruct-q4_K_M
            - name: OLLAMA_HOST
              value: http://host.docker.internal:11434
            - name: PROMETHEUS_URL
              value: http://monitoring-prometheus.monitoring.svc.cluster.local:9090
            - name: LOKI_URL
              value: http://loki.monitoring.svc.cluster.local:3100
            - name: KUBMEDIC_NAMESPACE
              value: boutique
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: kubmedic-agent
  namespace: boutique-agent
spec:
  selector:
    app: kubmedic-agent
  ports:
    - port: 8080
      targetPort: 8080
