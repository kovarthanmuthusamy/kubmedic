id: 11-bad-secret-ref
title: Bad Secret reference
service: emailservice
category: config
symptom: CreateContainerConfigError
alert:
  name: KubePodNotReady
  labels:
    namespace: boutique
    service: emailservice
  annotations:
    summary: 'emailservice: CreateContainerConfigError'
fault:
- service: emailservice
  key: env_from_secret
  value: email-credentials-typo
fix:
- service: emailservice
  key: env_from_secret
  value: ''
root_cause: emailservice references a Secret named email-credentials-typo, which does
  not exist.
root_cause_keywords:
- secret
evidence:
  pod:
    name: emailservice-7d9f6b5c4-x2abc
    service: emailservice
    status: CreateContainerConfigError
    ready: 0/1
    restarts: 0
  describe_lines:
  - 'State: Waiting'
  - 'Reason: CreateContainerConfigError'
  logs: []
  events:
  - 'Warning  Failed  kubelet  Error: secret "email-credentials-typo" not found'
